# nginx site for Mining Match. certbot --nginx adds the HTTPS (port 443) settings.
server {
    listen 80;
    server_name miningmatch.example.com.au;

    client_max_body_size 11m;          # uploads are limited to 10 MB by the app
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, so visitors can't fake it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
